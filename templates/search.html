{% extends 'base.html' %}
{% block content %}
<!-- Start All Title Box -->
    <div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>LOGIN</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active">ABOUT US</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- End All Title Box -->
<div class="container w-50 p-5 p-5 border border-2 shadow mt-5 mb-5">
    <div class="product-box">
        <div class="container">
            <h1 class="text-center">You have searched for "<span>{{query}}</span>"</h1>
            {% if products %}
    <div class="row special-list">
    {% for p in products %}
                <div class="col-lg-3 col-md-6 special-grid best-seller">
                    <div class="products-single fix">
                        <div class="box-img-hover">
                            <div class="type-lb">
                                <p class="sale">Sale</p>
                            </div>
                            <img src="{{p.image.url}}" class="img-fluid" alt="Image">
                            <div class="mask-icon">
                                <ul>
                                    <li><a href="#" data-toggle="tooltip" data-placement="right" title="View"><i class="fas fa-eye"></i></a></li>
                                    <li><a href="#" data-toggle="tooltip" data-placement="right" title="Compare"><i class="fas fa-sync-alt"></i></a></li>
                                    <li><a href="#" data-toggle="tooltip" data-placement="right" title="Add to Wishlist"><i class="far fa-heart"></i></a></li>
                                </ul>
                                <a class="cart" href="{% url 'shop:detail' p.id %}">Details</a>
                            </div>
                        </div>
                        <div class="why-text">
                            <h4>{{p.name}}</h4>
                            <h5>{{p.price}}</h5>
                        </div>
                    </div>
                </div>
        {% endfor %}
                </div>
        {% else %}
            <h5 style="text-align:center;">NO RESULTS</h5>
        {% endif %}
                </div>
        </div>
    </div>
{% endblock %}
