{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<!-- Start All Title Box -->
    <div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>LOGIN</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active">ABOUT US</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- End All Title Box -->

<h1 style="text-align:center; margin-top:5px;">Welcome to Login</h1>
<div class="container p-5 w-50 mt-5 border border-3 border-dark shadow text-center">
    <form method="post">
        {% csrf_token %}
        {{form|crispy}}
        <div class="mb-3">
        <input type="submit" class="btn btn-light mt-3">
            </div>
    </form>
</div>
{% endblock %}
